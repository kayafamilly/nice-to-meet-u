server {
    listen 80;
    listen [::]:80;
    server_name nice-to-meet-u.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / { return 301 https://nice-to-meet-u.com$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.nice-to-meet-u.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / { return 301 https://nice-to-meet-u.com$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name meet.nice-to-meet-u.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / { return 301 https://meet.nice-to-meet-u.com$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name turn.nice-to-meet-u.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / { return 404; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nice-to-meet-u.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/nice-to-meet-u.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nice-to-meet-u.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/nice-to-meet-u.access.log;
    error_log /var/log/nginx/nice-to-meet-u.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nice-to-meet-u.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/nice-to-meet-u.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nice-to-meet-u.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    return 301 https://nice-to-meet-u.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name meet.nice-to-meet-u.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/nice-to-meet-u.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nice-to-meet-u.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/nice-to-meet-u-livekit.access.log;
    error_log /var/log/nginx/nice-to-meet-u-livekit.error.log;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
}
