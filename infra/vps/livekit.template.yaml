# Rendered by scripts/render-livekit-config.sh. This file deliberately holds no
# secret and is safe to commit.
port: ${LIVEKIT_HTTP_PORT}
bind_addresses:
  - 0.0.0.0
rtc:
  tcp_port: ${LIVEKIT_TCP_PORT}
  port_range_start: ${LIVEKIT_UDP_PORT_START}
  port_range_end: ${LIVEKIT_UDP_PORT_END}
  use_external_ip: true
keys:
  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
redis:
  address: 127.0.0.1:${REDIS_PORT}
webhook:
  api_key: ${LIVEKIT_API_KEY}
  urls:
    - ${LIVEKIT_WEBHOOK_URL}
turn:
  enabled: true
  domain: ${TURN_DOMAIN}
  udp_port: ${TURN_UDP_PORT}
  relay_range_start: ${TURN_RELAY_PORT_START}
  relay_range_end: ${TURN_RELAY_PORT_END}
logging:
  level: info
